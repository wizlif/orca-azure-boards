<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <!-- Why: a stroked lemniscate stands in for the Azure DevOps infinity
  mark, monochrome per Orca's provider-icon convention. Two symmetric
  cubic loops sharing one centre point give the self-crossing for free. -->
