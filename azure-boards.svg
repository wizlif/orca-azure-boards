    d="M12,12 C9,4 5,4 2,12 C5,20 9,20 12,12 C15,4 19,4 22,12 C19,20 15,20 12,12"
    stroke="currentColor"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
